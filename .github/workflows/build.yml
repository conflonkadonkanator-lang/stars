name: Build ASI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile ASI
      run: cl.exe /O2 /LD main.cpp /Fe:VC.DynamicStars.asi user32.lib kernel32.lib /link /INCREMENTAL:NO

    - name: Upload ASI
      uses: actions/upload-artifact@v4
      with:
        name: VC-DynamicStars-ASI
        path: VC.DynamicStars.asi
