name: Build ASI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile Project
      run: msbuild project.vcxproj /p:Configuration=Release /p:Platform=Win32

    - name: Upload ASI
      uses: actions/upload-artifact@v4
      with:
        name: VC-DynamicStars-ASI
        path: VC.DynamicStars.asi
