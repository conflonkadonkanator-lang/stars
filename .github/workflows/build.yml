name: Build ASI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile ASI Plugin
      run: cl.exe /O2 /LD main.cpp /Fe:VC.DynamicStars.asi user32.lib kernel32.lib /link /INCREMENTAL:NO

    - name: Upload ASI
      uses: actions/upload-artifact@v4
      with:
        name: VC-DynamicStars-ASI
        path: VC.DynamicStars.asi
