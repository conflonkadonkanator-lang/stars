name: Build ASI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile ASI Plugin
      run: |
        g++ -shared -O2 main.cpp -o VC.DynamicStars.asi -luser32 -lkernel32 -static-libgcc -static-libstdc++

    - name: Upload ASI
      uses: actions/upload-artifact@v4
      with:
        name: VC-DynamicStars-ASI
        path: VC.DynamicStars.asi
